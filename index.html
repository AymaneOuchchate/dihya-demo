h3 {
  font-size: 1.34rem;
  letter-spacing: -0.025em;
}
a {
  color: var(--green);
  text-underline-offset: 3px;
}
button {
  background: none;
  border: 0;
}
svg.ic {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linejoin: round;
  stroke-linecap: round;
  flex: none;
}
button svg {
  pointer-events: none;
}
.wrap {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100dvh;
}
.side {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 32px 17px 16px;
  background: #f2f0e8;
  border-inline-end: 1px solid var(--border);
  z-index: 3;
}
.brand {
  display: flex;
  gap: 10px;
  align-items: center;
  color: #71372e;
  line-height: 0.95;
  margin: 0 7px 34px;
  text-align: start;
}
.brand img {
  width: 37px;
  height: 51px;
  object-fit: cover;
  mix-blend-mode: multiply;
  border-radius: 45% 45% 18% 18%;
}
.brand strong {
  font:
    2.45rem/0.95 Georgia,
    serif;
  letter-spacing: 0.065em;
}
.brand span {
  display: block;
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  margin-top: 6px;
  color: #705b4f;
}
.micro {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.navgroup .micro {
  margin: 18px 13px 7px;
}
.navbtn {
  width: 100%;
  padding: 11px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-radius: 8px;
  text-align: start;
  font-size: 0.95rem;
  color: #57574d;
}
.navbtn:hover,
.plain:hover {
  background: #e7e5db;
}
.navbtn.active {
  color: #713a31;
  font-weight: 650;
  background: #e7d9ce;
}
.navbtn.active .ic {
  stroke-width: 2;
}
.sidefoot {
  margin-top: auto;
}
.demobtn {
  display: flex;
  gap: 9px;
  align-items: center;
  justify-content: center;
  width: 100%;
  border: 1px solid #a4aa99;
  border-radius: 9px;
  padding: 10px 6px;
  color: var(--green);
  font-weight: 650;
  background: #f8f8f0;
}
.identity {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  padding: 15px 4px 2px;
  border-top: 1px solid var(--border);
  width: 100%;
  text-align: start;
}
.avatar {
  border-radius: 50%;
  width: 38px;
  height: 38px;
  background: #e7d0c3;
  display: grid;
  place-items: center;
  color: #713a31;
  font: 1.2rem Georgia;
}
.identity strong,
.identity small {
  display: block;
}
.identity small,
small,
.sub {
  color: var(--muted);
  font-size: 0.85rem;
}
.identity .ic {
  margin-inline-start: auto;
}
.maincol {
  min-width: 0;
}
.top {
  height: 66px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 clamp(18px, 3.5vw, 60px);
  background: var(--paper);
}
.crumb,
.flex,
.bar,
.sectionhead,
.actions,
.tag,
.btn,
.plain,
.mark,
.row,
.pill,
.seg,
.guidebar,
.guidehead {
  display: flex;
  align-items: center;
}
.crumb {
  gap: 11px;
  color: var(--muted);
  font-size: 0.91rem;
}
.crumb b {
  color: var(--ink);
  font-weight: 600;
}
.top .flex {
  gap: 16px;
}
.pill,
.tag {
  display: inline-flex;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 0.79rem;
  font-weight: 600;
}
.pill {
  background: #e8ece1;
  color: #405745;
}
.bullet {
  width: 6px;
  height: 6px;
  background: #587451;
  border-radius: 50%;
}
.lang {
  display: flex;
  align-items: center;
  gap: 6px;
}
.lang select {
  border: 0;
  background: transparent;
  width: auto;
  max-width: 100px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
}
.mobilebrand,
.menubtn {
  display: none;
}
main {
  max-width: 1390px;
  margin: auto;
  padding: 27px clamp(18px, 3.5vw, 60px) 40px;
}
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background: #f4e4d7;
  border: 1px solid #e4cfbf;
  border-radius: 17px;
  min-height: 211px;
  display: flex;
  align-items: center;
  padding: 26px 32px;
}
.heroart {
  position: absolute;
  z-index: -1;
  inset-block: 0;
  inset-inline-end: 0;
  width: 49%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 55%;
  mix-blend-mode: multiply;
  mask-image: linear-gradient(to right, transparent 0%, #000 26%);
  opacity: 0.94;
}
.hero .copy {
  max-width: 62%;
}
.eyeline {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #794738;
}
.eyeline .ic {
  width: 16px;
  height: 16px;
}
.hero h1 {
  margin: 9px 0 5px;
  color: #55352b;
}
.hero p {
  color: #654d42;
  margin-bottom: 16px;
}
.btn,
.plain,
.iconbtn,
.seg button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.9rem;
  line-height: 1.3;
  min-height: 39px;
  padding: 9px 14px;
}
.btn {
  background: var(--wine);
  color: #fff;
}
.btn.green {
  background: var(--green);
}
.btn.outline,
.iconbtn {
  background: var(--white);
  color: var(--ink);
  border: 1px solid var(--border);
}
.btn:hover {
  filter: brightness(0.95);
}
.btn:disabled {
  cursor: default;
  opacity: 0.62;
}
.btn .ic,
.plain .ic,
.eyeline .ic,
.tag .ic {
  width: 17px;
  height: 17px;
}
.plain {
  color: var(--green);
  padding: 7px 8px;
}
.iconbtn {
  padding: 7px;
  min-width: 36px;
  min-height: 36px;
}
.sectionhead,
.bar {
  justify-content: space-between;
  gap: 12px;
}
.sectionhead {
  margin: 25px 0 12px;
}
.sectionhead h2 {
  font-size: 1.72rem;
}
.sectionhead .sub {
  font-size: 0.82rem;
}
.grid2,
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 17px;
}
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  min-width: 0;
}
.card > .bar:first-child {
  margin-bottom: 16px;
}
.card h3,
.card h2 {
  display: flex;
  align-items: center;
  gap: 9px;
}
.iconbox {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 10px;
}
.clay {
  background: #f3dfd4;
  color: #994f3b;
}
.sage {
  background: #e2ebdd;
  color: #426043;
}
.sand {
  background: #f6e8c8;
  color: #8a672e;
}
.blue {
  background: #dee9ee;
  color: #486779;
}
.lilac {
  background: #e9e3ef;
  color: #6b567f;
}
.ringrow {
  display: flex;
  align-items: center;
  gap: clamp(10px, 2vw, 30px);
}
.ring {
  width: 110px;
  height: 110px;
  flex: none;
  position: relative;
  display: grid;
  place-items: center;
  border-radius: 100%;
}
.ring svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.ringtext {
  text-align: center;
}
.ringtext strong {
  display: block;
  font: 2.05rem/0.94 Georgia;
  color: #603d32;
}
.ringtext small {
  display: block;
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  margin-top: 4px;
}
.metric strong {
  display: block;
  font-weight: 650;
}
.metric small {
  display: block;
  margin-top: 3px;
}
.metric + .metric {
  margin-top: 11px;
}
.agenda {
  display: grid;
  gap: 9px;
}
.agenda .row {
  gap: 11px;
}
.stamp {
  width: 47px;
  min-width: 47px;
  min-height: 45px;
  display: grid;
  align-content: center;
  text-align: center;
  color: #874c3a;
  background: #f6e9e0;
  border-radius: 8px;
  font-size: 0.76rem;
  line-height: 1.1;
}
.stamp strong {
  font-size: 1.06rem;
}
.stamp.sage {
  background: #e6ecdf;
  color: #496044;
}
.agenda .row + .row {
  padding-top: 9px;
  border-top: 1px solid #ece9df;
}
.row b {
  font-size: 0.94rem;
}
.row small {
  display: block;
}
.row .end,
.row > .ic:last-child {
  margin-inline-start: auto;
}
.check {
  width: 27px;
  height: 27px;
  display: inline-grid;
  place-items: center;
  border: 1px solid #a7b3a8;
  border-radius: 50%;
  color: var(--green);
  flex: none;
}
.check.on {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.check .ic {
  width: 17px;
  height: 17px;
}
.feature {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: #dfe9de;
  color: #234b3b;
  border: 1px solid #c6d6c5;
  border-radius: 14px;
  padding: 20px 24px;
  margin-top: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.feature:after {
  content: "";
  position: absolute;
  inset: 0 0 0 58%;
  opacity: 0.2;
  z-index: -1;
  background: repeating-conic-gradient(
    from 22.5deg at 50% 50%,
    transparent 0deg 41deg,
    #879e7e 42deg 44deg,
    transparent 45deg 90deg
  );
  background-size: 48px 48px;
  mask-image: linear-gradient(to right, transparent, #000);
}
.feature h2 {
  font-size: 1.8rem;
  margin: 3px 0;
}
.feature p {
  font-size: 0.94rem;
}
.feature .micro {
  color: #526a55;
}
.actions {
  flex-wrap: wrap;
  gap: 8px;
}
.pagehead {
  margin: 7px 0 25px;
}
.pagehead .micro {
  color: var(--wine);
}
.pagehead h1 {
  margin: 7px 0;
  font-size: clamp(2.5rem, 4vw, 3.8rem);
}
.pagehead p {
  color: var(--muted);
  max-width: 65ch;
}
.stack {
  display: grid;
  gap: 15px;
  align-content: start;
}
.card p {
  margin: 9px 0;
}
.card h2,
.modal h2 {
  font-size: 1.7rem;
}
.cal {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  text-align: center;
}
.cal .dow {
  font-size: 0.78rem;
  color: var(--muted);
}
.cal button {
  position: relative;
  width: 100%;
  min-height: 34px;
  border-radius: 7px;
}
.cal button.period,
.dot.period {
  background: #efd6ce;
}
.cal button.fertile,
.dot.fertile {
  background: #dce7d9;
}
.cal button.sel {
  outline: 2px solid var(--wine);
  outline-offset: -2px;
}
.cal button.haslog:after {
  content: "";
  position: absolute;
  bottom: 3px;
  left: calc(50% - 2px);
  width: 4px;
  height: 4px;
  background: var(--ink);
  border-radius: 10px;
}
.leg {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 14px 0;
  font-size: 0.81rem;
  color: var(--muted);
}
.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-inline-end: 4px;
}
.notice {
  font-size: 0.87rem;
  padding: 10px 13px;
  background: #f2f0e8;
  border-radius: 8px;
  color: #54574d;
}
.rows {
  display: grid;
}
.listrow {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 0;
  border-block-end: 1px solid #e9e6dc;
  overflow-wrap: anywhere;
}
.listrow:last-child {
  border: 0;
}
.listrow > div {
  min-width: 0;
}
.listrow strong,
.listrow small {
  display: block;
}
.listrow .end {
  margin-inline-start: auto;
}
.topicgrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.topiccard {
  text-align: start;
  min-height: 138px;
  display: flex;
  flex-direction: column;
  align-items: start;
  gap: 10px;
}
.topiccard:hover,
.suggest:hover {
  border-color: #a9b49d;
  background: #f5f7ef;
}
.topiccard .iconbox {
  width: 44px;
  height: 44px;
}
.topiccard small {
  margin-top: auto;
}
.control {
  display: grid;
  gap: 5px;
  font-weight: 600;
  font-size: 0.91rem;
  margin: 12px 0;
}
.control input,
.control select,
.control textarea,
textarea.askbox {
  width: 100%;
  border: 1px solid #c7c6ba;
  border-radius: 8px;
  background: #fffefa;
  padding: 10px 12px;
  font-weight: 400;
}
.control textarea,
textarea.askbox {
  resize: vertical;
  min-height: 80px;
}
.control input[type="checkbox"] {
  width: auto;
}
.suggest {
  padding: 9px 12px;
  border: 1px solid #d6d8ca;
  border-radius: 8px;
  text-align: start;
  font-size: 0.9rem;
  background: #f8f9f3;
}
.answer {
  border-top: 4px solid var(--green);
}
.answer .tag {
  margin: 12px 0 2px;
}
.answer .source {
  font-size: 0.85rem;
  overflow-wrap: anywhere;
}
.answer .notice {
  margin: 14px 0;
}
.urgent {
  border-color: #a44539;
}
.modal {
  padding: 25px;
}
.modal .bar {
  margin-bottom: 12px;
}
.modal .actions {
  justify-content: flex-end;
  margin-top: 18px;
}
dialog {
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 15px;
  width: min(460px, calc(100% - 26px));
  max-height: 88dvh;
  color: var(--ink);
  background: var(--white);
  box-shadow: 0 18px 80px #33271736;
}
dialog::backdrop {
  background: #231e185c;
}
#toast {
  position: fixed;
  inset-inline-end: 20px;
  bottom: 20px;
  z-index: 10;
  background: #284737;
  color: white;
  border-radius: 10px;
  padding: 10px 16px;
  max-width: min(90vw, 420px);
  pointer-events: none;
  opacity: 0;
}
#toast.shown {
  opacity: 1;
}
.guide {
  position: sticky;
  bottom: 10px;
  margin: 10px clamp(12px, 3vw, 50px);
  background: #293e35;
  color: #fff;
  padding: 13px 18px;
  border-radius: 10px;
  box-shadow: 0 5px 24px #24372935;
  z-index: 4;
}
.guidebar,
.guidehead {
  gap: 10px;
  justify-content: space-between;
}
.guide p {
  font-size: 0.92rem;
}
.guide .btn {
  background: #f7e6d4;
  color: #47392b;
}
.guide .plain {
  color: white;
}
.guide .plain:hover {
  background: #3c5446;
}
.guide strong {
  font-family: var(--serif);
  font-size: 1.2rem;
}
.guide small {
  color: #dae6d9;
}
.empty {
  color: var(--muted);
  font-size: 0.93rem;
}
.seg {
  gap: 6px;
  flex-wrap: wrap;
}
.seg button {
  border: 1px solid var(--border);
  background: #f8f7f0;
}
.seg .active {
  background: #e1ebdf;
  border-color: #99af96;
}
.savedq {
  margin: 9px 0;
  padding: 10px 14px;
  border-inline-start: 3px solid #95b298;
  background: #edf2e9;
}
.footer {
  margin-top: 21px;
  font-size: 0.77rem;
  color: var(--muted);
}
.skip {
  position: fixed;
  left: -9999px;
}
.skip:focus {
  left: 5px;
  top: 5px;
  background: white;
  z-index: 10;
}
.mobilemenu {
  position: fixed;
  inset: 0;
  background: #302b235c;
  z-index: 6;
}
.mobilemenu .side {
  display: flex;
  width: min(300px, 83vw);
  height: 100dvh;
}
.mobilemenu .sidefoot {
  margin-top: auto;
}
.divider {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}
.printonly {
  display: none;
}
[dir="rtl"] .heroart {
  transform: scaleX(-1);
}
[dir="rtl"] h1,
[dir="rtl"] h2,
[dir="rtl"] h3 {
  letter-spacing: 0;
  font-family: Tahoma, Arial, sans-serif;
}
[dir="rtl"] .micro {
  letter-spacing: 0;
}
.help {
  font-size: 0.84rem;
  color: var(--muted);
}
.hidden {
  display: none !important;
}
button:disabled {
  cursor: default;
}
details summary {
  cursor: pointer;
  color: var(--green);
  font-weight: 600;
}
details .suggest {
  display: block;
  margin: 6px 0;
  width: 100%;
}
@media (min-width: 1600px) {
  .wrap {
    grid-template-columns: 260px 1fr;
  }
  .hero {
    min-height: 250px;
  }
  .card {
    padding: 25px;
  }
}
@media (max-width: 1050px) {
  .wrap {
    grid-template-columns: 195px minmax(0, 1fr);
  }
  .side {
    padding-inline: 10px;
  }
  .card {
    padding: 16px;
  }
  .ring {
    width: 88px;
    height: 88px;
  }
  .top {
    padding-inline: 22px;
  }
  main {
    padding-inline: 22px;
  }
  .grid2,
  .cols {
    gap: 12px;
  }
  .hero {
    padding: 24px;
  }
  .top .flex {
    gap: 8px;
  }
  .topicgrid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 800px) {
  .wrap {
    display: block;
  }
  .wrap > .side {
    display: none;
  }
  .top {
    height: 57px;
    padding-inline: 15px;
  }
  .menubtn,
  .mobilebrand {
    display: inline-flex;
  }
  .mobilebrand {
    font: 1.35rem Georgia;
    letter-spacing: 0.08em;
    color: var(--wine);
  }
  .crumb > span,
  .crumb > b {
    display: none;
  }
  .top .pill {
    font-size: 0.72rem;
  }
  .hero {
    min-height: 192px;
  }
  main {
    padding: 16px;
  }
  .sectionhead {
    margin-top: 20px;
  }
  .cols {
    grid-template-columns: 1fr;
  }
  .guide {
    bottom: 6px;
  }
  .guidebar {
    flex-wrap: wrap;
  }
  .card h2 {
    font-size: 1.5rem;
  }
}
@media (max-width: 600px) {
  .hero {
    padding: 18px;
    min-height: 190px;
    align-items: flex-start;
  }
  .hero h1 {
    font-size: 2.45rem;
  }
  .hero .copy {
    max-width: 78%;
  }
  .hero p {
    font-size: 0.9rem;
    max-width: 24ch;
  }
  .heroart {
    width: 47%;
    opacity: 0.68;
    mask-image: linear-gradient(to right, transparent, #000 48%);
  }
  .grid2 {
    grid-template-columns: 1fr;
  }
  .ring {
    width: 90px;
    height: 90px;
  }
  .ringrow {
    gap: 22px;
  }
  .hero .micro {
    font-size: 0.69rem;
  }
  .feature {
    align-items: flex-start;
    flex-direction: column;
    padding: 18px;
  }
  .topicgrid {
    gap: 9px;
  }
  .topiccard {
    min-height: 136px;
  }
  .sectionhead h2 {
    font-size: 1.5rem;
  }
  .sectionhead .sub {
    font-size: 0.76rem;
  }
  .guide strong {
    font-size: 1.05rem;
  }
  .guide {
    padding: 11px;
  }
  .guide .actions {
    gap: 4px;
  }
  .top .lang .ic {
    display: none;
  }
  .card > .bar:first-child {
    margin-bottom: 12px;
  }
  .pagehead {
    margin-bottom: 18px;
  }
  .sectionhead .sub {
    max-width: 43%;
    text-align: end;
  }
}
@media print {
  body {
    background: white;
  }
  .wrap,
  .side,
  .top,
  .guide,
  #toast,
  dialog,
  main,
  .mobilemenu,
  .skip {
    display: none !important;
  }
  .printonly {
    display: block;
    padding: 24px;
  }
  .printonly h1 {
    font-size: 30px;
  }
  .printonly h2 {
    font-size: 20px;
    margin-top: 18px;
  }
  .printonly p {
    margin: 5px 0;
  }
}

@media (min-width: 801px) {
  .menubtn {
    display: none;
  }
}

@media (max-width: 600px) {
  .heroart {
    width: 44%;
    opacity: 0.53;
    mask-image: linear-gradient(to right, transparent, #000 70%);
  }
  .hero .copy {
    max-width: 90%;
  }
}
.notebooks {
  display: inline-flex;
  max-width: 100%;
  gap: 3px;
  padding: 4px;
  margin: 0 0 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #f0eee6;
}
.booktab {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 36px;
  padding: 6px 13px;
  border-radius: 7px;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--muted);
}
.booktab .ic {
  width: 17px;
  height: 17px;
}
.booktab[aria-pressed="true"] {
  background: var(--white);
  color: var(--green);
  box-shadow: 0 1px 4px #43382422;
}
.malehero {
  background: #e4eade;
  border-color: #cbd8c6;
}
.malehero .eyeline,
.malehero h1,
.malehero p {
  color: #314d3f;
}
.examrow {
  align-items: flex-start;
}
.examrow strong {
  overflow-wrap: anywhere;
}
.printaction {
  margin-top: 18px;
}
@media (max-width: 600px) {
  .notebooks {
    width: 100%;
  }
  .booktab {
    flex: 1;
    padding-inline: 4px;
  }
  .examrow .actions {
    flex-wrap: nowrap;
  }
}

function cycle() {
  const first = month + "-01",
    offset = (dateObj(first).getUTCDay() + 6) % 7,
    end = new Date(
      Date.UTC(+month.slice(0, 4), +month.slice(5), 0),
    ).getUTCDate();
  const log = state.journal[selected];
  let cells = "";
  for (let i = 0; i < offset; i++) cells += "<span></span>";
  for (let i = 1; i <= end; i++) {
    const date = month + "-" + String(i).padStart(2, "0"),
      d = state.start ? dayDiff(date, state.start) + 1 : 0;
    const tone =
      date === state.start
        ? "period"
        : estOK() && d >= state.length - 19 && d <= state.length - 14
          ? "fertile"
          : "";
    cells +=
      '<button aria-label="' +
      att(fmt(date, { day: "numeric", month: "long", year: "numeric" })) +
      '" aria-pressed="' +
      (selected === date) +
      '" class="' +
      tone +
      (date === selected ? " sel" : "") +
      (state.journal[date] ? " haslog" : "") +
      '" data-act="day:' +
      date +
      '">' +
      i +
      "</button>";
  }
  return (
    header(
      "cycle",
      t(
        "Retrouvez vos observations et les dates de votre cycle.",
        "راجعي ملاحظاتك وتواريخ دورتك.",
        "شوفي الملاحظات وتواريخ الدورة ديالك.",
      ),
    ) +
    '<div class="cols"><section class="card"><div class="bar"><h2>' +
    fmt(first, { month: "long", year: "numeric" }) +
    '</h2><div class="actions">' +
    iconButton(
      t("Mois précédent", "الشهر السابق", "الشهر اللي فات"),
      "month:-1",
      "left",
    ) +
    iconButton(
      t("Mois suivant", "الشهر التالي", "الشهر الجاي"),
      "month:1",
      "right",
    ) +
    '</div></div><div class="cal">' +
    Array.from(
      { length: 7 },
      (_, i) =>
        '<b class="dow">' +
        fmt(dayPlus("2026-11-16", i), { weekday: "short" }) +
        "</b>",
    ).join("") +
    cells +
    '</div><div class="leg"><span><i class="dot period"></i>' +
    t("Début des règles", "بداية الحيض", "بداية الحيض") +

    '</div><p class="notice">' +
    (estOK()

const deepSeekEnabled = () => document.documentElement.dataset.deepseek === "true" && guide < 0;

async function deepSeekAnswer(question, language) {
  try {
    const endpoint = document.documentElement.dataset.deepseekEndpoint || "/api/orient";
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, language }),
      signal: AbortSignal.timeout(18000),
    });
    if (!response.ok) return null;
    const { topic, explanation, consultation } = await response.json();
    if (!TOPICS.some((item) => item.id === topic)) return null;
    return { id: topic, explanation, consultation, language };
  } catch {
    return null;
  }
}

    (form
      ? '<div class="actions">' +
        button(cancelLabel(), "close", "", "plain") +
        '<button type="submit" class="btn">' +
        e(submit || saveLabel()) +
        "</button></div></form>"
      : "") +
    "</div>";
  dlg.setAttribute("aria-labelledby", "dialogTitle");
  if (!dlg.open) dlg.showModal();
}
function journalForm(date) {
  const j = state.journal[date] || { mood: 0, mucus: 0, test: 0, note: "" };
  modal(
    t("Mon observation", "ملاحظتي", "الملاحظة ديالي"),
    "<p>" +
      fmt(date, { weekday: "long", day: "numeric", month: "long" }) +
      '</p><input type="hidden" name="date" value="' +
      date +
      '">' +
      f(
        t("Comment je me sens", "كيف أشعر", "كيف حاسة"),
        '<select name="mood">' + options(MOODS, j.mood) + "</select>",
      ) +
      f(
        t("Glaire cervicale", "مخاط عنق الرحم", "الإفرازات ديال عنق الرحم"),
        '<select name="mucus">' + options(MUCUS, j.mucus) + "</select>",
      ) +
      f(
        t("Test d’ovulation", "اختبار الإباضة", "تيست التبويض"),
        '<select name="test">' + options(TESTS, j.test) + "</select>",
      ) +
      f(
        t(
          "Note personnelle (facultatif)",
          "ملاحظة شخصية (اختياري)",
          "ملاحظة ديالي (اختياري)",
        ),
        '<textarea name="note" maxlength="350" dir="auto">' +
          e(j.note) +
          "</textarea>",
      ),
    "journalform",
  );
}
function cycleFields() {
  return (
    f(
      t(
        "Premier jour des dernières règles",
        "أول يوم في آخر دورة",
        "أول نهار فالدورة الأخيرة",
      ),
      '<input type="date" required name="start" max="' +
        now() +
        '" value="' +
        e(state.start) +
        '">',
    ) +
    f(
      t(
        "Durée habituelle du cycle, en jours",
        "طول الدورة المعتاد بالأيام",
        "شحال كتدوم الدورة بالأيام",
      ),
      '<input type="number" min="15" max="90" step="1" required name="length" value="' +

        '">',
    ) +
    f(
      t("Régularité", "انتظام الدورة", "انتظام الدورة"),

        (state.regular ? "selected" : "") +
        ">" +
        t("Cycle régulier", "منتظمة", "منتظمة") +
        '</option><option value="no" ' +
        (!state.regular ? "selected" : "") +
        ">" +
        t(
          "Irrégulier ou incertain",
          "غير منتظمة أو غير مؤكدة",
          "ما منتظماش ولا ما متأكداش",
        ) +
        "</option></select>",
    )
  );
}
function entryForm(isAppt) {
  modal(
    isAppt
      ? t("Nouveau rendez-vous", "موعد جديد", "موعد جديد")
      : t("Nouveau rappel de prise", "تذكير جديد", "تذكير جديد"),
    f(
      t("Intitulé", "التسمية", "السميّة"),
      '<input name="title" required maxlength="70" dir="auto">',
    ) +
      (isAppt
        ? f(
            t("Date", "التاريخ", "التاريخ"),
            '<input required type="date" name="date" value="' + now() + '">',
          )
        : "") +
      f(
        t("Heure", "الوقت", "الوقت"),
        '<input required name="time" type="time" value="' +
          (isAppt ? "09:00" : "20:00") +
          '">',
      ) +
      (isAppt
        ? ""
        : '<p class="help">' +
          t(
            "Reprenez le libellé de l’ordonnance fictive. Le rappel apparaît chaque jour dans le carnet.",
            "أدخلي اسم العلاج من الوصفة التجريبية. يظهر التذكير يومياً في الدفتر.",
            "دخلي سميّة الدوا من الوصفة التجريبية. التذكير كيبان كل نهار فالدفتر.",
          ) +
          "</p>"),
    isAppt ? "apptform" : "medform",
  );
}
function confirmAction(title, text, act) {
  modal(
    title,
    "<p>" +
      e(text) +
      '</p><div class="actions">' +
      button(cancelLabel(), "close", "", "plain") +
      button(t("Confirmer", "تأكيد", "نأكد"), act) +
      "</div>",
  );
}
function go(id) {
  if (
    !PAGES[id] ||
    (state.track === "male" &&
      !["home", "care", "partner", "settings"].includes(id))
  )
    return;
  page = id;
  menu = false;
  render();
  window.scrollTo(0, 0);
  document.querySelector("#main").focus({ preventScroll: true });
}
async function setAnswer(q, useDeepSeek = false) {
  const question = q.slice(0, 400).trim();
  if (!question || (answer?.kind === "pending" && query === question)) return;
  query = question;
  const local = classify(question);
  if (useDeepSeek && deepSeekEnabled() && !["urgent", "clinical"].includes(local.kind)) {
    const pending = { kind: "pending" };
    answer = pending;
    render();
    document.querySelector("#response")?.scrollIntoView({ block: "nearest" });
    const detail = await deepSeekAnswer(question, state.lang);
    if (answer !== pending || query !== question) return;
    answer = detail && (local.kind !== "topic" || local.id === detail.id)
      ? { ...detail, kind: "topic" }
      : local;
    if (page !== "ask") return;
  } else {
    answer = local;
  }
  render();
  document
    .querySelector("#response")
    ?.scrollIntoView({ behavior: "instant", block: "nearest" });
}
function saveQuestion() {
  if (!query || state.saved.some((s) => s.question === query)) return;
  state.saved.push({
    question: query,
    topic: answer?.id || null,
    date: now(),
    stage: state.stage,
  });
  persist();
}
function scene(index) {
  guide = index;
  page = SCENES[index][0];
  if (SCENES[index][3] === "male") {
    state = books.male;
    state.lang = 0;
    if (
      index === SCENES.length - 1 &&
      !state.saved.some((q) => q.id === "guide-question")
    )
      saveMaleQuestion({
        recordId: "guide-question",
        question: DEMO_QUESTION[2],
        apptId: "y1",
      });
    render();
    window.scrollTo(0, 0);
    return;
  }
  state = books.female;
  state.lang = index === 3 || index === 4 ? 2 : 0;
  selected = now();
  month = selected.slice(0, 7);
  query = "";
  answer = null;
  if (index >= 1)
    state.journal[now()] = {
      mood: 1,
      mucus: 0,
      test: 0,
      note: "Préparer ma question pour le rendez-vous.",
    };
  if (index >= 3) {
    query = TOPICS[0].questions[0][2];
    if (index >= 4) answer = classify(query);
  }
  if (index === 5) saveQuestion();
  render();
  window.scrollTo(0, 0);
  if (index === 5)
    document.querySelector("#consult")?.scrollIntoView({ block: "nearest" });
  if (index === 4)
    document.querySelector("#response")?.scrollIntoView({ block: "nearest" });
}
function startDemo() {
  menu = false;
  if (guide >= 0) {
    render();
    return;
  }
  const first =
    state.track === "male" ? SCENES.findIndex((s) => s[3] === "male") : 0;
  backup = { books, state, page, selected, month, query, answer };
  books = freshBooks();
  scene(first);
}
function stopAuto() {
  if (timer) clearInterval(timer);
  timer = null;
}
function endDemo() {
  stopAuto();
  if (backup) {
    ({ books, state, page, selected, month, query, answer } = backup);
    backup = null;
  }
  guide = -1;
  render();
  window.scrollTo(0, 0);
}
function nextScene() {
  if (guide >= SCENES.length - 1) endDemo();
  else scene(guide + 1);
}
function clearTo(demo) {
  const { track, lang, keep } = state;
  if (!demo) books = freshBooks(false);
  state = books[track] = fresh(demo, track);
  state.lang = lang;
  state.keep = demo && keep;
  query = "";
  answer = null;
  selected = now();
  month = selected.slice(0, 7);
  persist();
  go("home");
}
function storageNotice() {
  return t(
    "Cette action remplace le carnet affiché et ses saisies.",
    "يستبدل هذا الإجراء الدفتر المعروض ومدخلاته.",
    "هاد العملية كتبدل الدفتر اللي مفتوح والمعطيات ديالو.",
  );
}
function act(action) {
  const [a, b, c] = action.split(":");
  if (a === "close") {
    dlg.close();
    return;
  }
  if (a === "menu") {
    menu = !menu;
    render();
    document.querySelector(".mobilemenu .navbtn")?.focus();
    return;
  }
  if (a === "go") {
    go(b);
    return;
  }
  if (a === "demo") {
    startDemo();
    return;
  }
  if (a === "exitdemo") {
    endDemo();
    return;
  }
  if (a === "next") {
    nextScene();
    return;
  }
  if (a === "auto") {
    if (timer) stopAuto();
    else
      timer = setInterval(() => {
        if (!dlg.open) nextScene();
      }, 9000);
    render();
    return;
  }
  if (a === "book") {
    if (guide >= 0 || !["female", "male"].includes(b) || state.track === b)
      return;
    const { lang, keep } = state;
    state = books[b];
    state.lang = lang;
    state.keep = keep;
    selected = now();
    month = selected.slice(0, 7);
    query = "";
    answer = null;
    persist();
    go("home");
    return;
  }
  if (state.track === "male" && (a === "exam" || a === "malequestion")) {
    if (a === "exam") examForm(b);
    else questionForm(b);
    return;
  }
  if (a === "day") {
    selected = b;
    render();
    return;
  }
  if (a === "month") {
    const d = dateObj(month + "-01");
    d.setUTCMonth(d.getUTCMonth() + Number(b));
    month = iso(d).slice(0, 7);
    render();
    return;
  }
  if (a === "journal" || a === "journaldate") {
    journalForm(a === "journal" ? now() : selected);
    return;
  }
  if (a === "cycleform") {
    modal(
      t("Régler mon cycle", "ضبط الدورة", "نضبط الدورة"),
      cycleFields(),
      "datesform",
    );
    return;
  }
  if (a === "appointment" || a === "medication") {
    entryForm(a === "appointment");
    return;
  }
  if (a === "take") {
    const m = state.meds.find((x) => x.id === b);
    if (m) {
      if (m.taken[now()]) delete m.taken[now()];
      else m.taken[now()] = true;
      persist();
      render();
    }
    return;
  }
  if (a === "delete") {
    confirmAction(
      t("Supprimer cette entrée ?", "حذف هذا العنصر؟", "نحيد هاد العنصر؟"),
      t(
        "Cette entrée sera retirée du carnet.",
        "سيُحذف هذا العنصر من الدفتر.",
        "هاد العنصر غادي يتحيد من الدفتر.",
      ),
      "remove:" + b + ":" + c,
    );
    return;
  }
  if (a === "remove" && ["appts", "meds", "saved"].includes(b)) {
    if (state.track === "male" && b === "appts")
      for (const question of state.saved)
        if (question.apptId === c) question.apptId = "";
    state[b] = state[b].filter((x) => x.id !== c);
    dlg.close();
    persist();
    render();
    return;
  }
  if (a === "topic" || a === "sample") {
    const o = TOPICS.find((x) => x.id === b);
    page = "ask";
    setAnswer(txt(o.questions[Number(c) || 0]), true);
    return;
  }
  if (a === "savequestion") {
    saveQuestion();
    render();
    notify(
      t(
        "Question ajoutée au carnet de consultation.",
        "أُضيف السؤال إلى دفتر الاستشارة.",
        "تزاد السؤال لدفتر الموعد.",
      ),
    );
    return;
  }
  if (a === "print") {
    window.print();
    return;
  }
  if (a === "newprofile") {
    modal(
      t("Créer un carnet fictif", "إنشاء دفتر تجريبي", "ندير دفتر تجريبي"),
      '<p class="help">' +
        storageNotice() +
        "</p>" +
        f(
          t("Prénom fictif", "اسم وهمي", "سميّة خيالية"),
          '<input name="name" required maxlength="28" dir="auto">',
        ) +
        f(
          t("Langue", "اللغة", "اللغة"),
          '<select name="lang">' +
            options(
              [
                L("Français", "Français", "Français"),
                L("العربية", "العربية", "العربية"),
                L("الدارجة", "الدارجة", "الدارجة"),
              ],
              state.lang,
            ) +
            "</select>",
        ) +
        (state.track === "male"
          ? ""
          : f(
              t("Étape", "المرحلة", "المرحلة"),
              '<select name="stage">' + options(STAGES, 0) + "</select>",
            )),
      "profileform",
      t("Créer le carnet", "إنشاء الدفتر", "ندير الدفتر"),
    );
    return;
  }
  if (a === "reset" || a === "erase") {
    confirmAction(
      a === "reset"
        ? t(
            "Recommencer la démonstration ?",
            "إعادة العرض التجريبي؟",
            "نعاود الديمو؟",
          )
        : t("Effacer le carnet ?", "مسح الدفتر؟", "نمسح الدفتر؟"),
      a === "erase"
        ? t(
            "Les deux carnets et leurs saisies seront effacés de cet appareil.",
            "سيُمسح الدفتران ومدخلاتهما من هذا الجهاز.",
            "غادي يتمسحو الدفترين والمعطيات ديالهم من هاد الجهاز.",
          )
        : storageNotice(),
      "confirmed:" + a,
    );
    return;
  }
  if (a === "confirmed") {
    dlg.close();
    clearTo(b === "reset");
  }
}
document.addEventListener("click", (ev) => {
  if (ev.target.id === "backdrop") {
    menu = false;
    render();
    return;
  }
  const el = ev.target.closest("[data-act]");
  if (el) act(el.dataset.act);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && menu) {
    menu = false;
    render();
    document.querySelector(".menubtn")?.focus();
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "question") {
    query = ev.target.value;
    if (answer) {
      answer = null;
      document.querySelector("#response")?.remove();
    }
  }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.matches('#examform [name="kind"]')) {
    const show = el.value === "other";
    const container = el.form.querySelector("#exam-custom");
    container.hidden = !show;
    el.form.elements.title.required = show;
    el.form.elements.title.disabled = !show;
  } else if (el.matches("[data-lang]")) {
    state.lang = Number(el.value);
    persist();
    render();
  } else if (el.id === "stage") {
    state.stage = Number(el.value);
    persist();
    render();
  } else if (el.id === "keep") {
    state.keep = el.checked;
    persist();
  } else if (el.matches("[data-task]")) {
    state.tasks[Number(el.dataset.task)] = el.checked;
    persist();
  }
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const d = Object.fromEntries(new FormData(form));
  if (form.id === "askform") {
    if (!String(d.question).trim()) {
      form.elements.question.focus();
      return;
    }
    void setAnswer(d.question, true);
    return;
  }
  if (form.id === "examform") {
    if (!saveExam(d)) {
      form.elements.title.focus();
      return;
    }
  } else if (form.id === "malequestionform") {
    if (!saveMaleQuestion(d)) {
      form.elements.question.focus();
      return;
    }
  } else if (form.id === "journalform") {
    if (d.date > now()) return;
    state.journal[d.date] = {
      mood: +d.mood,
      mucus: +d.mucus,
      test: +d.test,
      note: d.note.trim(),
    };
    selected = d.date;
    month = selected.slice(0, 7);
  } else if (form.id === "datesform") {
    state.start = d.start;
    state.length = +d.length;
    state.regular = d.regular === "yes";
    selected = d.start;
    month = selected.slice(0, 7);
  } else if (form.id === "apptform" || form.id === "medform") {
    if (!d.title.trim()) {
      form.elements.title.focus();
      return;
    }
    if (form.id === "apptform")
      state.appts.push({
        id: uid(),
        title: d.title.trim(),
        date: d.date,
        time: d.time,
      });
    else
      state.meds.push({
        id: uid(),
        title: d.title.trim(),
        time: d.time,
        taken: {},
      });
  } else if (form.id === "profileform") {
    if (!d.name.trim()) {
      form.elements.name.focus();
      return;
    }
    const { track, keep } = state;
    state = books[track] = fresh(false, track);
    state.keep = keep;
    state.name = d.name.trim();
    state.lang = +d.lang;
    state.stage = Number(d.stage || 0);
    page = "home";
    selected = now();
    month = selected.slice(0, 7);
    query = "";
    answer = null;
  } else return;
  dlg.close();
  persist();
  render();
  notify(t("Carnet mis à jour.", "تم تحديث الدفتر.", "تسجل فالدفتر."));
});
render();

// Reminders are delivered while the notebook is open. No health data leaves the browser.
let announcedReminders = new Set();
function showDueReminders() {
  if (guide >= 0 || document.hidden) return;
  const current = new Date();
  const clockTime = [current.getHours(), current.getMinutes()]
    .map((v) => String(v).padStart(2, "0"))
    .join(":");
  const day = now();
  for (const med of state.meds) {
    const key = [day, med.id, med.time].join("/");
    if (med.time !== clockTime || med.taken[day] || announcedReminders.has(key))
      continue;
    announcedReminders.add(key);
    notify(
      t("Rappel de prise", "تذكير بالعلاج", "تذكير بالدوا") +
        " · " +
        medName(med) +
        " · " +
        med.time,
    );
  }
}
setInterval(showDueReminders, 15000);
document.addEventListener("visibilitychange", showDueReminders);
